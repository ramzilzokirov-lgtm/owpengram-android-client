name: VGRAM Private Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - vgram-private
    paths:
      - '**.java'
      - '**.kt'
      - '**.xml'
      - '**.gradle'
      - '**.properties'
      - 'gradle/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: vgram-private-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android toolchain
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Build VGRAM Private debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :TMessagesProj_AppStandalone:assembleAfatDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VGRAM-Private-Android-debug
          path: TMessagesProj_AppStandalone/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: error
          retention-days: 14
